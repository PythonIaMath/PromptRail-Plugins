name: Verify npm stable

on:
  push:
    tags:
      - "npm-stable-v*"

concurrency:
  group: npm-stable-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Test and verify stable release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Validate stable release
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const lockfile = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const expectedTag = `npm-stable-v${manifest.version}`;
          const stablePattern = /^\d+\.\d+\.\d+$/;

          if (!stablePattern.test(manifest.version)) {
            throw new Error(`Refusing to publish prerelease version as latest: ${manifest.version}`);
          }
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match ${expectedTag}`);
          }
          if (lockfile.version !== manifest.version || lockfile.packages?.[""]?.version !== manifest.version) {
            throw new Error("package-lock.json version does not match package.json");
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Verify the Changesets release
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const registryUrl = `https://registry.npmjs.org/${encodeURIComponent(manifest.name)}`;
          const attempts = 12;

          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            const response = await fetch(registryUrl, {
              headers: { accept: "application/json" },
            });
            if (response.ok) {
              const metadata = await response.json();
              const published = metadata.versions?.[manifest.version];
              const latest = metadata["dist-tags"]?.latest;
              if (published?.dist?.integrity && latest === manifest.version) {
                console.log(`${manifest.name}@${manifest.version} is published as latest.`);
                process.exit(0);
              }
            }
            if (attempt < attempts) {
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }
          }

          throw new Error(
            `${manifest.name}@${manifest.version} was not available as latest after ${attempts} checks.`,
          );
          NODE
